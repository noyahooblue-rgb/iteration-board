# ============================================================
# iteration-board offline package - application config template
# install.bat copies this file to config\application.yml and
# replaces the placeholders below. Edit values, then restart
# the application service (stop.bat / start.bat) to apply.
# ============================================================
server:
  port: __APP_PORT__
  servlet:
    session:
      timeout: 8h

spring:
  application:
    name: iteration-board
  datasource:
    # PostgreSQL listens on localhost only, port 15432.
    url: jdbc:postgresql://127.0.0.1:15432/iteration_board
    username: postgres
    # Random password generated by install.bat at install time.
    password: __DB_PASSWORD__
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  # Keep registration open until the first (admin) account and
  # the initial teams are created; you may close it afterwards.
  registration-open: true
  demo-mode: false

# API docs (Swagger UI / OpenAPI): OFF by default (security ruling,
# 1.1.0-rc2). Set both to true and restart to enable; even then the
# docs require a signed-in platform admin account.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ------------------------------------------------------------
# AI features (optional). Leave blank to run without AI:
# the six AI features stay disabled and everything else works.
# To enable AI, fill in an OpenAI-compatible endpoint:
#   base-url: e.g. https://api.example.com/v1
#   api-key:  your API key (keep this file private)
#   text-model / vision-model: model names from your provider
#   mode: set to "live" after filling the values above
# ------------------------------------------------------------
ai:
  base-url: ""
  api-key: ""
  text-model: ""
  vision-model: ""
  mode: mock
  timeout-seconds: 60
  platform-enabled: true
  prompts-dir: config/prompts

# ------------------------------------------------------------
# Backups (1.1.0). Directory for backup folders created by
# backup.bat and the start/stop/upgrade/rollback scripts.
# Empty (default) = the "backup" folder inside the install
# folder. Set an absolute path to put backups on another
# disk or a shared folder, e.g.  dir: "E:\\iteration-board-backup"
# ------------------------------------------------------------
backup:
  dir: ""

logging:
  level:
    com.iterationboard: INFO
  file:
    name: logs/app.log
