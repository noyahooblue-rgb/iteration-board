                  date: { type: string, format: date }
                  content: { type: string }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/overview:
    get:
      summary: 组长总览（成员行 + 风险清单 + 迭代健康度）
      description: >
        每位成员一行：成员状态、在做事项、最近更新时间、待更新数、剩余故事点与剩余容量（容量口径见 TeamSettings）。
        risks 与 iterationHealth 仅组长与 PO 可见（canViewRisks=false 时 risks 为空数组、iterationHealth 为 null）。
        风险由规则计算，不由 AI 判定。
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/reminders/scan:
    post:
      summary: 立即扫描自动提醒（仅组长；与定时扫描同一实现，对应验收 ）
      description: >
        按 规则表逐条扫描：进行中无进展、待开始未动工、待验收未处理、待认领无人领、
        阻塞未解除、临近截止、已逾期。阈值取小组设置（工作日口径，含特殊日期）。
        请假/出差成员不提醒本人、改提醒组长。同一规则同一事项同一接收人当天不重复生成。
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      responses:
        '200':
          description: OK，返回各规则本次新建提醒数
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: object
                    additionalProperties: { type: integer }
                  totalCreated: { type: integer }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/reports/generate:
    post:
      summary: 生成报告（ + Q1：一周期一份；已有未删报告返回 200 且 existed=true 不新建；已有墓碑（已删）时手动生成视为有意恢复——原地重生返回 201 且 restored=true 并写审计日志，定时任务仍跳过墓碑；未来周期 400；生成权限——站会/周报/风险=组长/PO，迭代总结=组长，我的周报=本人；支持 Idempotency-Key）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, description: '幂等键：同用户同键 10 分钟内重复提交返回首次结果' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [STANDUP_SUMMARY, WEEKLY, ITERATION_SUMMARY, PERSONAL_WEEKLY, RISK_SUMMARY] }
                periodStart: { type: string, format: date, description: 周期开始（站会/风险=日期；周报/我的周报=周开始；缺省按当日/当周） }
                periodEnd: { type: string, format: date, description: 周期结束（周类缺省为 periodStart+6 天） }
                iterationId: { type: integer, format: int64, description: 仅 ITERATION_SUMMARY——指定迭代（Q7 按 iterationId 唯一）；缺省取进行中或最近结束的迭代 }
      responses:
        '201':
          description: 已生成（existed=false；墓碑恢复时 restored=true）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '200':
          description: 该周期已有报告，未新建（existed=true，body 为已有报告）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/reports:
    get:
      summary: 报告列表（：服务端按可见范围过滤——风险摘要仅组长/PO、我的周报仅本人、其余全组；不含已删；非成员 404）
