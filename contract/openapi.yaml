                        ok: { type: boolean }
        '400': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/ai/summarize:
    post:
      summary: 自动汇总叙述预览/自测入口（不落库）：与 POST /reports/generate 同一路径——程序算事实表，模型只写叙述，校验编号/数字一致才采用（aiGenerated=true），否则程序模板（aiGenerated=false）
