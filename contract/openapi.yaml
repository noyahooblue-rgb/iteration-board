    post:
      summary: 新增关键日期（组长或 PO）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: iterationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, date]
              properties:
                title: { type: string }
                date: { type: string, format: date }
                category: { type: string, enum: [FREEZE, RELEASE, REVIEW, OTHER], description: 缺省 OTHER }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyDate' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/key-dates/{keyDateId}:
    delete:
      summary: 删除关键日期（组长或 PO）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: keyDateId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/standup:
    get:
      summary: 站会数据（按人：昨日进展与完成、今日在手、当前阻塞）
      description: >
        date 缺省今天。「昨日」= date 的上一个工作日（按小组特殊日期计算）内该成员登记的进展与当天完成事项；
        「今日」= 当前由其负责的进行中/待开始事项；「阻塞」= 其负责的带阻塞标记事项。附该日站会备注。
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Standup' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/standup/note:
    put:
      summary: 保存站会备注（任一成员；同日一条，覆盖更新）
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      requestBody:
        required: true
