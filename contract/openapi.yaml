                    type: array
                    items:
                      type: object
                      properties:
                        itemId: { type: integer, format: int64, nullable: true }
                        itemCode: { type: string, nullable: true }
                        reason: { type: string }
                        action: { type: string }
                  signals:
                    type: array
                    items:
                      type: object
                      properties:
                        rule: { type: string }
                        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
                        itemId: { type: integer, format: int64, nullable: true }
                        itemCode: { type: string, nullable: true }
                        userId: { type: integer, format: int64, nullable: true }
                        message: { type: string }
        '403': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/ai/qa:
    post:
      summary: AI 问答（只读）：模型把问题转结构化查询条件，程序用参数化查询取数（强制 team 过滤），模型据数据作答并引用事项编号；查不到 found=false 明确说查不到；结果存本人问答记录
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
