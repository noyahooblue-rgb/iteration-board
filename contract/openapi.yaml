                periodStart: { type: string, format: date }
                periodEnd: { type: string, format: date }
                iterationId: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  content: { type: string }
                  aiGenerated: { type: boolean }
        '403': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/ai/risk-summary:
    get:
      summary: 风险摘要（仅组长/PO）：规则信号由程序风险规则计算（AI 不判定），AI 只汇总排序为最需关注 3 件 + 原因 + 建议动作；AI 不可用时 aiGenerated=false 且 signals 为规则清单原样
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
