      summary: 一句话更新解析：句子 + 我负责的未完成事项 + 成员名单给模型，返回动作卡（不写库）；拿不准给 ≤3 候选；阻塞类说法未明说阻塞时卡上带 needsBlockConfirm；对不上的片段单列 unmatched
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  actions:
                    type: array
                    items: { $ref: '#/components/schemas/QuickAction' }
                  unmatched:
                    type: array
                    items: { type: string }
        '503': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/ai/quick-update/apply:
    post:
      summary: 一句话更新确认执行：按确认后的动作经既有进展/流转/创建服务落库；支持 Idempotency-Key（Q13）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
