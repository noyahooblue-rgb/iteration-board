                actions:
                  type: array
                  items: { $ref: '#/components/schemas/QuickAction' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string }
