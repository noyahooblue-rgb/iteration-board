      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: 编辑迭代（名称/目标/起止日期；Q3 起仅组长，PO 与成员 403）
      parameters:
