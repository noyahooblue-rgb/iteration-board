              schema:
                type: object
                properties:
                  recordId: { type: integer, format: int64 }
                  found: { type: boolean }
                  answer: { type: string }
                  refs:
                    type: array
                    items: { type: string }
        '503': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/ai/qa/history:
    get:
