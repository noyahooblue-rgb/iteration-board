openapi: 3.0.3
info:
  title: 迭代小组平台 API（M4 契约）
  version: 0.5.3
  description: >
    真实后端（Spring Boot）与浏览器模拟后端共同遵循的唯一契约。
    0.5.3（M5 验收结论落地）：①新增 GET /teams/{teamId}/iterations/planning-target
    （规划页默认迭代：有规划中迭代返回规划中，否则返回进行中，两者皆无 404）；
    规划页可对规划中与进行中迭代放入/移出故事（事项的 iterationId 目标迭代须为
    PLANNING 或 ACTIVE，已结束迭代拒绝排入）；②GET /teams/{teamId}/audit-logs
    对非成员由 403 改为 404（与全仓「不存在或无权访问」约定一致），成员非组长仍 403。
    0.5.2（M5）：Q6 审计日志读取侧落地（小组组长/平台管理员读本组、平台管理员读全部，只读）；
    Q4 数据留存口径入后端配置（回收站 30 天物理清理、通知 90 天、审计日志 180 天，app.retention.* 可配，无新增接口）。
    0.5.0（M4）：Q1–Q15 待问结论落地（Q4/Q6 读取侧除外）+ AI 服务层与六项功能正式定义 + 导入批次 + 外部对接适配器；
    Item/Report 附 allowedActions；报告只保留小组路径（Q8）；后端静态 openapi 副本已删除，本文件为唯一来源（Q5）。
    错误统一格式 {code, message, detail}；修改类接口带 version，冲突返回 409。
    状态流转见 contract/state-machine.md。
    M2（修订一，最高口径）：事项类型改为 TASK 任务 / STORY 故事 / DEFECT 缺陷 /
    ANALYSIS 分析 / ADHOC 临时事项；父子关系只允许 STORY→TASK；负责人改为数组
    ownerIds（共同负责）；任务状态由故事推算（见 TaskStatus 与 state-machine.md
    「任务状态推算」节）；AI 接口按修订一第 8 节预留、标注 M4 实现，本阶段只写契约不实现。
    M3（验收批复落实）：①任务新增 REJECT 打回（仅 PO、待验收时，reason 必填，且必须
    同时选择重开哪些已完成故事或新建补充故事，无可做故事不允许打回）；
    ②共同负责下 TRANSFER 改为只替换一位负责人（replaceUserId 指定被替换者，
    缺省为发起人本人；其余共同负责人保留）；③小组设置新增容量系数
    capacityPointsPerWorkday（默认 1），个人剩余容量 = 剩余可用工作日 × 系数，只提示不拦截；
    ④Item 补 inviteeIds（被邀请认领人，被 M2 列为契约缺口）；⑤补齐契约缺口五项：
    小组设置 PATCH / 归档 / 退出、单事项催一下与快捷回应、迭代列表、通知查询；
    ⑥M3 功能：通知中心与 SSE 实时推送、自动提醒扫描、成员状态、站会、总览与风险、
    迭代全生命周期（创建/开始/结束结转/燃尽图/关键日期）、报告与 Excel 导出。
  x-type-colors: >
    分类色（修订一第 1 节）：任务 TASK 蓝 #007AFF；故事 STORY 按 storyCategory——
    DEV 开发 青 #30B0C7、ANALYSIS 分析 紫 #AF52DE、TEST 测试 薄荷 #00C7BE、OTHER 其他 棕 #A2845E；
    缺陷 DEFECT 粉 #FF2D55；独立分析 ANALYSIS 紫 #AF52DE；临时事项 ADHOC 橙 #FF9500。
  x-security-notes: >
    CSRF（M1 收尾正式入契约，与真实后端现有实现一致）：服务端启用 CSRF 防护，
    令牌经 Cookie 下发——Cookie 名 XSRF-TOKEN，非 HttpOnly，前端可读取；
    所有变更类请求（POST/PATCH/DELETE 等非安全方法）必须带请求头 X-XSRF-TOKEN，
    其值为该 Cookie 的当前值；令牌缺失或不匹配时服务端返回 403。
    会话 Cookie 本身为 HttpOnly + SameSite。
servers:
  - url: /api/v1
paths:
  /meta:
    get:
      summary: 运行环境信息（前端据此决定是否显示注册入口与演示标识）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  registrationOpen: { type: boolean }
                  demoMode: { type: boolean }
  /auth/captcha:
    get:
      summary: 获取图形验证码（本地生成 SVG，无外网依赖）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  captchaId: { type: string }
                  imageSvg: { type: string }
  /auth/register:
    post:
      summary: 注册（开放注册开关关闭时返回 403 REGISTRATION_CLOSED）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginName, displayName, password, captchaId, captchaCode]
              properties:
                loginName: { type: string, minLength: 3, maxLength: 32 }
                displayName: { type: string, minLength: 1, maxLength: 32 }
                password: { type: string, description: 至少 8 位且同时含字母和数字 }
                captchaId: { type: string }
                captchaCode: { type: string }
      responses:
        '201': { description: 已注册并登录（会话 Cookie 已下发） }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      summary: 登录（连续失败 3 次后要求验证码；5 次锁定 15 分钟）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loginName, password]
              properties:
                loginName: { type: string }
                password: { type: string }
                captchaId: { type: string }
                captchaCode: { type: string }
      responses:
        '200':
          description: OK，返回当前用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      summary: 退出登录
      responses:
        '204': { description: 已退出 }
  /auth/me:
    get:
      summary: 当前登录用户（未登录 401）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/change-password:
    post:
      summary: 修改密码（成功后其他会话失效；临时密码首次登录强制修改走此接口）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [oldPassword, newPassword]
              properties:
                oldPassword: { type: string }
                newPassword: { type: string }
      responses:
        '204': { description: 已修改 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /teams:
    post:
      summary: 创建小组（创建者成为组长，返回邀请码；代号全平台唯一、不区分大小写，冲突 409 TEAM_CODE_TAKEN）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code]
              properties:
                name: { type: string, maxLength: 64 }
                code: { type: string, description: 2 至 5 个字母，事项编号前缀；全平台唯一（不区分大小写），创建时校验，冲突返回 409 TEAM_CODE_TAKEN }
                themeColor: { type: string, enum: [blue, indigo, violet, pink, orange, green, teal], default: blue }
                iterationWeeks: { type: integer, minimum: 1, maximum: 4, default: 2 }
                joinApproval: { type: boolean, default: true }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/mine:
    get:
      summary: 我加入的小组列表
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
  /teams/by-invite/{inviteCode}:
    get:
      summary: 按邀请码预览小组（加入前确认）
      parameters:
        - name: inviteCode
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  team: { $ref: '#/components/schemas/Team' }
                  leaderName: { type: string }
                  alreadyMember: { type: boolean }
        '404': { $ref: '#/components/responses/Error' }
  /teams/join:
    post:
      summary: 用邀请码加入（需审批时生成待审申请；免审批时直接加入）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteCode]
              properties:
                inviteCode: { type: string }
      responses:
        '200':
          description: joined=true 表示已直接加入；false 表示已提交申请待审批
          content:
            application/json:
              schema:
                type: object
                properties:
                  joined: { type: boolean }
                  team: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/join-requests:
    get:
      summary: 待审加入申请（仅组长）
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/JoinRequest' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/join-requests/{requestId}/approve:
    post:
      summary: 审批通过并分配角色（仅组长）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: requestId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '204': { description: 已通过 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/join-requests/{requestId}/reject:
    post:
      summary: 审批拒绝（仅组长）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: requestId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 已拒绝 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members:
    get:
      summary: 小组成员（仅成员可见，非成员 404）
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Member' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/members/{userId}/role:
    patch:
      summary: 分配角色（仅组长；不能移除最后一名组长）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: userId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        '204': { description: 已更新 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/invite-code/reset:
    post:
      summary: 重置邀请码（仅组长）
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  inviteCode: { type: string }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/items:
    get:
      summary: 事项列表（看板用；支持按状态/负责人/类型/迭代筛选）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ItemStatus' }
        - name: ownerId
          in: query
          description: 按负责人筛选（共同负责任一命中即可）
          schema: { type: integer, format: int64 }
        - name: parentId
          in: query
          schema: { type: integer, format: int64 }
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/ItemType' }
        - name: iterationId
          in: query
          schema: { type: integer, format: int64 }
        - name: scope
          in: query
          schema: { type: string, enum: [current, daily, all], default: all }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/Error' }
    post:
      summary: >
        新建事项（去向 POOL 认领池 / INVITE 邀请认领 / ASSIGN 直接指派）。
        权限（修订一）：TASK 任务与 STORY 故事仅 PO 可创建，非 PO 调用返回 403；
        DEFECT/ANALYSIS/ADHOC 独立事项任何成员可建。
        STORY 必须带 parentId（同组 TASK）与 storyCategory，缺失或父非 TASK 返回 400；
        非 STORY 不得带 parentId（父子只允许 STORY→TASK）。
        TASK 不认领、无负责人与迭代归属：poId 为所属 PO（缺省为创建人），状态由故事推算。
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, title, destination]
              properties:
                type: { $ref: '#/components/schemas/ItemType' }
                title: { type: string, maxLength: 200 }
                description: { type: string }
                priority: { type: string, enum: [P0, P1, P2, P3], default: P2 }
                destination: { type: string, enum: [POOL, INVITE, ASSIGN] }
                ownerIds:
                  type: array
                  description: ASSIGN 时必填，共同负责可多人；被直接指派的负责人 assignedDirectly=true，可婉拒（DECLINE）
                  items: { type: integer, format: int64 }
                assigneeId: { type: integer, format: int64, description: 兼容字段，等价于 ownerIds 只有一个元素；新客户端用 ownerIds }
                inviteeIds:
                  type: array
                  items: { type: integer, format: int64 }
                acceptorId: { type: integer, format: int64, description: 缺省为创建人（故事/独立事项）；TASK 无验收人语义 }
                storyCategory: { $ref: '#/components/schemas/StoryCategory', description: 'STORY 必填' }
                poId: { type: integer, format: int64, description: TASK 专用，所属 PO；缺省为创建人 }
                dueDate: { type: string, format: date }
                estimate: { type: number, description: 估算（单位见小组 estimateUnit，新建小组默认故事点 POINTS） }
                parentId: { type: integer, format: int64, description: 仅 STORY 可带，且必须指向同组 TASK }
                iterationId: { type: integer, format: int64, description: TASK 不可带（任务无迭代归属） }
                labelNames:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/items/{itemId}:
    get:
      summary: 事项详情
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      summary: 编辑事项字段（带 version，冲突 409）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/ItemId' }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, description: Q13，同键 10 分钟只生效一次 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [P0, P1, P2, P3] }
                acceptorId: { type: integer, format: int64, nullable: true }
                dueDate: { type: string, format: date, nullable: true }
                estimate: { type: number, nullable: true }
                iterationId: { type: integer, format: int64, nullable: true }
                parentId: { type: integer, format: int64, nullable: true, description: 仅 STORY 可改，且必须指向同组 TASK }
                storyCategory: { $ref: '#/components/schemas/StoryCategory' }
                poId: { type: integer, format: int64, nullable: true, description: TASK 专用 }
                ownerIds:
                  type: array
                  description: >-
                    M3 新增：整体替换负责人集合（抽屉常用字段点击即改用）。元素必须是小组成员；
                    集合为空且事项为 NOT_STARTED 时回到 UNCLAIMED；UNCLAIMED 事项设置非空负责人后进入
                    NOT_STARTED 并记为直接指派。TASK 不可改（恒为空）。
                  items: { type: integer, format: int64 }
                labelNames:
                  type: array
                  description: M3 新增：整体替换标签集合（按名称，不存在的自动创建）
                  items: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      summary: 软删除事项（进回收站，30 天内可恢复；删除故事后重算父任务状态）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '204': { description: 已软删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/items/{itemId}/restore:
    post:
      summary: 从回收站恢复事项（恢复故事后重算父任务状态）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/ItemId' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/items/{itemId}/join:
    post:
      summary: >
        加入共同负责：已有负责人且未完成（非 DONE/CANCELLED）的故事/独立事项，
        任何成员可 join 成为共同负责人（权限与原负责人相同），并通知原负责人。
        Q13（0.5.0）：已是负责人再 join 返回当前状态 200 不报错，并支持 Idempotency-Key；无负责人（待认领）请走 CLAIM。
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/ItemId' }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, description: Q13，同键 10 分钟只生效一次 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: integer }
      responses:
        '200':
          description: OK，返回加入后的事项（ownerIds 含新负责人）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/items/{itemId}/transitions:
    post:
      summary: 执行状态流转（规则见 state-machine.md；Q13：CLAIM 支持 Idempotency-Key，且已认领者再认领返回当前状态不报错）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/ItemId' }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, description: 仅 CLAIM 生效，同键 10 分钟只生效一次 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, version]
              properties:
                action:
                  type: string
                  enum: [CLAIM, START, SUBMIT, APPROVE, REJECT, RELEASE, TRANSFER, DECLINE, CANCEL, REOPEN]
                  description: >
                    DECLINE（婉拒，M2 已实现）：NOT_STARTED→UNCLAIMED；仅被直接指派
                    （assignedDirectly=true）的负责人本人；事项无任何 progress 记录；
                    reason 必填；清空全部负责人；通知创建人。
                    共同负责口径：任一负责人可 CLAIM 后的登记进展/提交验收（见 progress 接口）；
                    RELEASE 由任一负责人执行并清空全部负责人；
                    TRANSFER（M3 定稿，取代 M2 暂行口径）：单负责人时替换为新负责人；
                    多名共同负责人时只替换一位——replaceUserId 指定被替换者，缺省为发起人本人
                    （发起人不是负责人且未指定 replaceUserId 时返回 400）；其余共同负责人保留。
                    作用于 UNCLAIMED 时仍视同指派（进入 NOT_STARTED）。
                    TASK 任务不走普通流转：仅 PO 可 APPROVE（待验收→已完成）、CANCEL（reason 必填）
                    与 REJECT 打回（M3 新增：仅待验收时，reason 必填，且必须通过 reopenItemIds
                    重开至少一个已完成故事、或通过 newStories 新建至少一个补充故事，否则 422；
                    打回后任务状态随故事推算回到进行中），其余动作 422。
                version: { type: integer }
                reason: { type: string, description: REJECT/RELEASE/CANCEL/DECLINE 必填 }
                newAssigneeId: { type: integer, format: int64, description: TRANSFER 必填（新负责人；与 newOwnerId 二选一） }
                newOwnerId: { type: integer, format: int64, description: TRANSFER 新负责人的新字段名，与 newAssigneeId 二选一 }
                replaceUserId: { type: integer, format: int64, description: TRANSFER 专用：共同负责时被替换的那一位负责人 id；缺省为发起人本人 }
                reopenItemIds:
                  type: array
                  description: TASK 的 REJECT 专用：要重开的已完成故事 id 列表（必须是该任务下 DONE 的故事）
                  items: { type: integer, format: int64 }
                newStories:
                  type: array
                  description: TASK 的 REJECT 专用：打回时新建的补充故事（进认领池 UNCLAIMED）
                  items:
                    type: object
                    required: [title, storyCategory]
                    properties:
                      title: { type: string }
                      storyCategory: { $ref: '#/components/schemas/StoryCategory' }
                      estimate: { type: number, nullable: true }
      responses:
        '200':
          description: OK，返回流转后的事项
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
