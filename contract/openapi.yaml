        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/imports:
    get:
      summary: 导入批次列表（可见：发起人、组长、PO，）
      parameters: [{ $ref: '#/components/parameters/TeamId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ImportBatch' }
    post:
      summary: 导入确认写入（仅 PO）：真正写入任务并生成批次；外部编号去重（同组同系统名同编号只更新标题/描述/截止，不动负责人/状态/进展）；单次 ≤100 条；支持 Idempotency-Key，同键只生效一次并返回已生成批次（含 link 语义，）。行可直接给 rows，或给 rawRows+mapping（字段→列序号，服务端按映射取数）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source: { type: string, enum: [AI_PASTE, FILE_MAPPING, ADAPTER], default: AI_PASTE }
                systemName: { type: string, description: 外部命名空间（缺省 AI_PASTE / FILE 按 source 取） }
                rows:
                  type: array
                  items: { $ref: '#/components/schemas/ImportRowInput' }
                rawRows:
                  type: array
                  items:
                    type: array
                    items: { type: string }
                mapping:
                  type: object
                  description: 字段名 → 列序号（0 起）
                  additionalProperties: { type: integer }
      responses:
        '201':
          description: 已生成批次
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportBatch' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/imports/{batchId}/undo:
    post:
      summary: 整批撤销（发起人或组长，24 小时内；超时 409 UNDO_EXPIRED）：新建任务软删、更新任务回滚导入前快照
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
