        - name: commentId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/iterations/{iterationId}/key-dates/{keyDateId}:
    patch:
      summary: 修改关键日期（：增删改仅组长/PO；删除端点为 DELETE /teams/{teamId}/key-dates/{keyDateId}）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: iterationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: keyDateId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                date: { type: string, format: date }
                category: { type: string, enum: [FREEZE, RELEASE, REVIEW, OTHER] }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /notifications:
    get:
      summary: 我的通知（通知中心；M3 补契约缺口 e）
      parameters:
        - name: teamId
          in: query
          required: false
          schema: { type: integer, format: int64, description: 只看某小组的通知；缺省全部 }
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [ASSIGNMENT, NUDGE, MENTION, ITEM_UPDATE, REMINDER, SYSTEM], description: 按类别过滤 }
      responses:
        '200':
          description: OK（按时间倒序，最多 200 条）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Notification' }
  /notifications/unread-count:
    get:
      summary: 未读通知数（顶栏铃铛）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
  /notifications/read-all:
    post:
      summary: 全部标为已读（可带 teamId 只处理某组）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                teamId: { type: integer, format: int64, nullable: true }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
  /notifications/{notificationId}/read:
    post:
      summary: 单条标为已读
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notification' }
        '404': { $ref: '#/components/responses/Error' }
  /notifications/stream:
    get:
      summary: 实时推送（SSE；事件 notification.created，前端断线重连后以列表接口补齐）
      responses:
        '200':
          description: SSE 长连接
          content:
            text/event-stream:
              schema: { type: string }
  /auth/notification-prefs:
    get:
      summary: 我的通知偏好（按类别开关；ASSIGNMENT 与 NUDGE 不可关闭，强行传 false 时服务端仍按开启处理）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
    patch:
      summary: 更新我的通知偏好
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPrefs' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPrefs' }
  /teams/{teamId}/audit-logs:
    get:
      summary: 审计日志（本组，只读；M5/Q6）——本组组长（LEADER）或平台管理员可读；普通成员/PO 403；非成员 404（0.5.3 起，与全仓约定一致）
      parameters:
        - { name: teamId, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: actorId, in: query, required: false, schema: { type: integer, format: int64 }, description: 按操作者筛选 }
        - { name: action, in: query, required: false, schema: { type: string }, description: 按动作精确筛选 }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间（ISO，含） }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间（ISO，含） }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 }, description: 默认按 createdAt 倒序 }
      responses:
        '200':
          description: OK，分页信封 {content, page, size, totalElements, totalPages}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error', description: 非成员（0.5.3 起） }
  /admin/audit-logs:
    get:
      summary: 审计日志（全部小组，只读；M5/Q6）——仅平台管理员，非管理员 403；teamId 不传=全部小组
      parameters:
        - { name: teamId, in: query, required: false, schema: { type: integer, format: int64 }, description: 按小组筛选 }
        - { name: actorId, in: query, required: false, schema: { type: integer, format: int64 }, description: 按操作者筛选 }
        - { name: action, in: query, required: false, schema: { type: string }, description: 按动作精确筛选 }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time }, description: 起始时间（ISO，含） }
        - { name: to, in: query, required: false, schema: { type: string, format: date-time }, description: 结束时间（ISO，含） }
        - { name: page, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 20 }, description: 默认按 createdAt 倒序 }
      responses:
        '200':
          description: OK，分页信封 {content, page, size, totalElements, totalPages}
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogPage' }
        '403': { $ref: '#/components/responses/Error' }
components:
  parameters:
    TeamId:
      name: teamId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: integer, format: int64 }
  responses:
    Error:
      description: 统一错误格式
      content:
        application/json:
          schema:
            type: object
            properties:
              code: { type: string, description: 如 VALIDATION / INVALID_CREDENTIALS / ACCOUNT_LOCKED / VERSION_CONFLICT / ILLEGAL_TRANSITION / FORBIDDEN / NOT_FOUND / TEAM_CODE_TAKEN / LOGIN_NAME_TAKEN }
              message: { type: string }
              detail: { type: object, nullable: true }
  schemas:
    AuditLog:
      type: object
      description: 审计日志条目（Q6，只读；actorName 为操作者显示名，可解析时返回）
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64, nullable: true }
        actorId: { type: integer, format: int64 }
        actorName: { type: string, nullable: true }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: integer, format: int64, nullable: true }
        detail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    AuditLogPage:
      type: object
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    Role:
      type: string
      enum: [LEADER, PO, MEMBER]
    ItemType:
      type: string
      description: >
        修订一类型模型：TASK 任务（PO 创建，不认领，蓝 #007AFF）/ STORY 故事（仅 PO 创建，
        必须挂同组 TASK，认领单位）/ DEFECT 缺陷（粉 #FF2D55）/ ANALYSIS 独立分析（紫 #AF52DE）/
        ADHOC 临时事项（橙 #FF9500）。M1 的 REQUIREMENT 已迁移为 TASK、旧 TASK 已迁移为 STORY。
      enum: [TASK, STORY, DEFECT, ANALYSIS, ADHOC]
    StoryCategory:
      type: string
      description: 故事类别（仅 STORY）：DEV 开发 青 #30B0C7 / ANALYSIS 分析 紫 #AF52DE / TEST 测试 薄荷 #00C7BE / OTHER 其他 棕 #A2845E
      enum: [DEV, ANALYSIS, TEST, OTHER]
    ItemStatus:
      type: string
      description: 故事与独立事项的状态（任务用 TaskStatus，见 Item.taskStatus）
      enum: [UNCLAIMED, NOT_STARTED, IN_PROGRESS, IN_REVIEW, DONE, CANCELLED]
    TaskStatus:
      type: string
      description: >
        任务专用状态（由故事推算，非流转产生，规则见 state-machine.md「任务状态推算」）：
        NOT_STARTED 未开始 / IN_PROGRESS 进行中 / PENDING_ACCEPTANCE 待验收 / DONE 已完成 / CANCELLED 已取消
      enum: [NOT_STARTED, IN_PROGRESS, PENDING_ACCEPTANCE, DONE, CANCELLED]
    User:
      type: object
      properties:
        id: { type: integer, format: int64 }
        loginName: { type: string }
        displayName: { type: string }
        avatarColor: { type: string }
        platformAdmin: { type: boolean }
        mustChangePassword: { type: boolean }
    Team:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        code: { type: string }
        description: { type: string, nullable: true }
        inviteCode: { type: string, description: 仅组长与创建响应可见 }
        joinApproval: { type: boolean }
        iterationWeeks: { type: integer }
        estimateUnit: { type: string, enum: [day, point], description: 估算单位；新建小组默认 point（故事点，修订一），小组设置仍可改为 day（人天） }
        themeColor: { type: string }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
        myRole: { $ref: '#/components/schemas/Role' }
        settings: { $ref: '#/components/schemas/TeamSettings' }
    TeamSettings:
      type: object
      description: 小组设置（存 team.settings_json；缺省值由服务端补齐后返回完整对象）
      properties:
        capacityPointsPerWorkday:
          type: number
          description: 容量系数（验收批复待问 3）：每人每个工作日约等于几个故事点，默认 1。个人本迭代剩余容量 = 剩余可用工作日 × 本系数。只用于提示，不拦截
        reminderThresholds:
          type: object
          description: 自动提醒阈值
          properties:
            staleInProgressDays: { type: integer, description: 进行中无新进展阈值，默认 2 }
            notStartedDays: { type: integer, description: 待开始未动工阈值，默认 2 }
            reviewPendingDays: { type: integer, description: 待验收未处理阈值，默认 2 }
            unclaimedDays: { type: integer, description: 待认领无人认领阈值，默认 3 }
            blockedDays: { type: integer, description: 阻塞未解除阈值，默认 2 }
            dueSoonDays: { type: integer, description: 临近截止提前量，默认 1 }
        specialHolidays:
          type: array
          description: 特殊非工作日（节假日），ISO 日期；工作日计算时扣除
          items: { type: string, format: date }
        specialWorkdays:
          type: array
          description: 特殊工作日（调休），ISO 日期；落在周末也算工作日
          items: { type: string, format: date }
    Member:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        displayName: { type: string }
        loginName: { type: string }
        avatarColor: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        memberStatus: { type: string, enum: [NORMAL, LEAVE, TRAVEL, SECONDED] }
        memberStatusStart: { type: string, format: date, nullable: true, description: 成员状态起始日（M3） }
        memberStatusEnd: { type: string, format: date, nullable: true, description: 成员状态结束日（M3） }
    JoinRequest:
      type: object
      properties:
        id: { type: integer, format: int64 }
        userId: { type: integer, format: int64 }
        displayName: { type: string }
        loginName: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        createdAt: { type: string, format: date-time }
    Item:
      type: object
      properties:
        id: { type: integer, format: int64 }
        code: { type: string, description: 显示编号，如 SKY-128 }
        type: { $ref: '#/components/schemas/ItemType' }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/ItemStatus' }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        creatorId: { type: integer, format: int64 }
        ownerIds:
          type: array
          description: 负责人数组（共同负责，M2 取代 assigneeId）；TASK 恒为空数组
          items: { type: integer, format: int64 }
        acceptorId: { type: integer, format: int64, nullable: true }
        storyCategory: { $ref: '#/components/schemas/StoryCategory', nullable: true, description: 仅 STORY }
        poId: { type: integer, format: int64, nullable: true, description: 仅 TASK，所属 PO }
        batchId: { type: integer, format: int64, nullable: true, description: 批量下发批次号，无批次为 null }
        assignedDirectly: { type: boolean, description: 是否直接指派而来（婉拒 DECLINE 的前置条件之一） }
        sortOrder: { type: integer, description: 故事在所属任务内的排序值 }
        taskStatus: { $ref: '#/components/schemas/TaskStatus', nullable: true, description: 仅 TASK；其余类型为 null。TASK 的 progressPercent 为推算值（故事点加权，无估算按件数） }
        collaboratorIds:
          type: array
          items: { type: integer, format: int64 }
        inviteeIds:
          type: array
          description: 被邀请认领的人（destination=INVITE 时写入；M3 补齐，M2 曾列为契约缺口）
          items: { type: integer, format: int64 }
        parentId: { type: integer, format: int64, nullable: true }
        iterationId: { type: integer, format: int64, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        estimate: { type: number, nullable: true }
        progressPercent: { type: integer }
        blocked: { type: boolean }
        blockReason: { type: string, nullable: true }
        nudgeCount: { type: integer }
        labels:
          type: array
          items: { type: string }
        childCount: { type: integer }
        childDoneCount: { type: integer }
        commentCount: { type: integer }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        source: { type: string, description: 来源 MANUAL / AI_PASTE / FILE_MAPPING / ADAPTER }
        externalSystem: { type: string, nullable: true, description: 外部系统名（导入/同步） }
        externalId: { type: string, nullable: true, description: 外部编号（同组同系统名唯一识别） }
        externalUrl: { type: string, nullable: true }
        externalClosed: { type: boolean, description: 外部已关闭标记（同步置位，不改平台状态） }
        allowedActions:
          type: array
          description: Q11——当前请求用户可执行的操作键（VIEW/EDIT/DELETE/RESTORE/CLAIM/JOIN/NUDGE/PROGRESS），权限判断只在服务端实现，前端按此显隐；无用户上下文的内部组装为空数组
          items: { type: string }
    ReportVersion:
      type: object
      properties:
        id: { type: integer, format: int64 }
        reportId: { type: integer, format: int64 }
        title: { type: string }
        content: { type: string, description: 仅单个版本端点返回 }
        editedByHuman: { type: boolean }
        createdAt: { type: string, format: date-time }
    Label:
      type: object
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        name: { type: string }
        color: { type: string, nullable: true }
        usageCount: { type: integer, description: 当前挂有该标签的事项数 }
        lastProgressAt: { type: string, format: date-time, nullable: true }
        checklist:
          type: array
          description: 检查清单，按 sortOrder 升序；增删改走 /checklist 子资源
          items: { $ref: '#/components/schemas/ChecklistEntry' }
    ChecklistEntry:
      type: object
      description: 检查清单条目
      properties:
        id: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        text: { type: string }
        done: { type: boolean }
        sortOrder: { type: integer }
    ProgressUpdate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        authorId: { type: integer, format: int64 }
        text: { type: string }
        percent: { type: integer, nullable: true }
        blocked: { type: boolean }
        blockReason: { type: string, nullable: true }
        nextStep: { type: string, nullable: true }
        kind: { type: string, enum: [NORMAL, KEEP_GOING] }
        createdAt: { type: string, format: date-time }
    Comment:
      type: object
      properties:
        id: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        authorId: { type: integer, format: int64 }
        content: { type: string }
        mentionIds:
          type: array
          items: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
    Activity:
      type: object
      properties:
        id: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        actorId: { type: integer, format: int64 }
        action: { type: string, description: CREATE / CLAIM / START / SUBMIT / APPROVE / REJECT / RELEASE / TRANSFER / DECLINE / CANCEL / REOPEN / EDIT / BLOCK / UNBLOCK / JOIN / DELETE / RESTORE }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string, nullable: true }
        detail: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    BacklogEntry:
      type: object
      description: 待办池一行：一个任务 + 其下故事概要
      properties:
        task: { $ref: '#/components/schemas/Item' }
        stories:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        storyCount: { type: integer }
        doneStoryCount: { type: integer }
    BatchMemberStatus:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        itemId: { type: integer, format: int64 }
        status: { $ref: '#/components/schemas/ItemStatus' }
    BatchSummary:
      type: object
      properties:
        batchId: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        creatorId: { type: integer, format: int64 }
        title: { type: string }
        type: { $ref: '#/components/schemas/ItemType' }
        total: { type: integer }
        doneCount: { type: integer }
        members:
          type: array
          items: { $ref: '#/components/schemas/BatchMemberStatus' }
        createdAt: { type: string, format: date-time }
    BatchNudgeResult:
      type: object
      properties:
        nudgedItemIds:
          type: array
          items: { type: integer, format: int64 }
        skippedItemIds:
          type: array
          description: 因每天一次规则或无组长可转而跳过的事项
          items: { type: integer, format: int64 }
        redirectedItemIds:
          type: array
          description: 被催人请假/出差、改记给组长的事项
          items: { type: integer, format: int64 }
    SavedFilter:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        criteria: { type: object, description: 筛选条件 JSON（原样存取，最小实现） }
        createdAt: { type: string, format: date-time }
    PlanningGroup:
      type: object
      properties:
        task: { $ref: '#/components/schemas/Item', nullable: true, description: 独立事项组为 null }
        items:
          type: array
          items: { $ref: '#/components/schemas/Item' }
    PlanningLoad:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        points: { type: number, description: 负载故事点（共同负责按人数均分；无估算按 0 计） }
        itemCount: { type: integer }
    PlanningCapacity:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        availableDays: { type: integer, description: 迭代工作日（周一至周五，扣小组特殊日期）扣本人请假/出差覆盖天数；迭代无起止日期时为 0 }
        claimedPoints: { type: number, description: 已认领故事点（同负载口径） }
        remainingDays: { type: integer, description: M3：自今天起（含）到迭代结束的剩余可用工作日（同上扣减口径，迭代已结束为 0） }
        capacityPoints: { type: number, description: M3（待问 3 定稿）：剩余容量 = remainingDays × 小组容量系数 capacityPointsPerWorkday }
        overCapacity: { type: boolean, description: M3：已认领未完成故事点（均分口径）超过剩余容量时为 true；只提示、不拦截 }
    Planning:
      type: object
      properties:
        iteration: { $ref: '#/components/schemas/Iteration' }
        groups:
          type: array
          items: { $ref: '#/components/schemas/PlanningGroup' }
        loads:
          type: array
          items: { $ref: '#/components/schemas/PlanningLoad' }
        capacities:
          type: array
          items: { $ref: '#/components/schemas/PlanningCapacity' }
    Iteration:
      type: object
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        goal: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status: { type: string, enum: [PLANNING, ACTIVE, FINISHED] }
    Notification:
      type: object
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64, nullable: true }
        type: { type: string, description: 事件类型，如 ASSIGN / TRANSFER / NUDGE / NUDGE_RESPONSE / MENTION / SUBMIT / APPROVE / REJECT / BLOCK / DECLINE / RELEASE / JOIN / TASK_PENDING_ACCEPTANCE / REMINDER_* / ITERATION_STARTED / ITERATION_FINISHED / JOIN_REQUEST 等 }
        category: { type: string, enum: [ASSIGNMENT, NUDGE, MENTION, ITEM_UPDATE, REMINDER, SYSTEM], description: 通知类别（偏好开关与筛选口径） }
        itemId: { type: integer, format: int64, nullable: true }
        itemCode: { type: string, nullable: true }
        actorId: { type: integer, format: int64, nullable: true }
        content: { type: string }
        readAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    NotificationPrefs:
      type: object
      description: 类别 → 是否接收。ASSIGNMENT（被指派）与 NUDGE（被催）不可关闭
      additionalProperties: { type: boolean }
    NudgeResult:
      type: object
      properties:
        itemId: { type: integer, format: int64 }
        nudgedUserIds:
          type: array
          description: 实际被催到的负责人/验收人
          items: { type: integer, format: int64 }
        redirectedToLeader: { type: boolean, description: 是否因对象请假/出差改记给组长 }
        nudgeCount: { type: integer, description: 催后事项本轮被催次数 }
    KeyDate:
      type: object
      properties:
        id: { type: integer, format: int64 }
        iterationId: { type: integer, format: int64 }
        title: { type: string }
        date: { type: string, format: date }
        category: { type: string, enum: [FREEZE, RELEASE, REVIEW, OTHER] }
    BurndownPoint:
      type: object
      properties:
        date: { type: string, format: date }
        remainingEstimate: { type: number, description: 当日剩余估算（未完成事项估算合计，无估算按 0） }
        remainingCount: { type: integer }
        doneCount: { type: integer }
    Burndown:
      type: object
      properties:
        iteration: { $ref: '#/components/schemas/Iteration' }
        points:
          type: array
          description: 实际线（快照点；迭代进行中时含当天实时点，live=true 标记）
          items:
            allOf:
              - { $ref: '#/components/schemas/BurndownPoint' }
              - type: object
                properties:
                  live: { type: boolean }
        ideal:
          type: array
          description: 理想线：自首个快照总量按迭代工作日线性降至结束日 0
          items: { $ref: '#/components/schemas/BurndownPoint' }
        totalEstimate: { type: number, description: 首个快照的剩余估算（理想线起点） }
    StandupMember:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        memberStatus: { type: string }
        yesterdayProgress:
          type: array
          description: 昨日（上一个工作日）登记的进展
          items: { $ref: '#/components/schemas/ProgressUpdate' }
        yesterdayDone:
          type: array
          description: 昨日完成的事项
          items: { $ref: '#/components/schemas/Item' }
        todayItems:
          type: array
          description: 今日在手：其负责的进行中/待开始事项
          items: { $ref: '#/components/schemas/Item' }
        blockedItems:
          type: array
          items: { $ref: '#/components/schemas/Item' }
    Standup:
      type: object
      properties:
        date: { type: string, format: date }
        previousWorkday: { type: string, format: date }
        members:
          type: array
          items: { $ref: '#/components/schemas/StandupMember' }
        note: { type: string, nullable: true, description: 当日站会备注 }
    RiskSignal:
      type: object
      properties:
        rule: { type: string, enum: [STALE, BLOCKED_LONG, DUE_SOON, OVERDUE, ITERATION_BEHIND, OVERLOAD, REVIEW_BACKLOG, NUDGED_OFTEN, UNCLAIMED_PRIORITY] }
        severity: { type: string, enum: [HIGH, MEDIUM, LOW] }
        itemId: { type: integer, format: int64, nullable: true }
        itemCode: { type: string, nullable: true }
        userId: { type: integer, format: int64, nullable: true, description: 与成员相关的信号（超载/验收积压） }
        message: { type: string }
    OverviewMember:
      type: object
      properties:
        userId: { type: integer, format: int64 }
        memberStatus: { type: string }
        memberStatusStart: { type: string, format: date, nullable: true }
        memberStatusEnd: { type: string, format: date, nullable: true }
        inProgressItems:
          type: array
          items: { $ref: '#/components/schemas/Item' }
        lastProgressAt: { type: string, format: date-time, nullable: true, description: 其负责事项的最近进展时间 }
        staleCount: { type: integer, description: 待更新数：进行中且超过提醒阈值无新进展的事项数 }
        remainingPoints: { type: number, description: 剩余故事点（未完成负责事项估算按共同负责人均分） }
        remainingCapacityPoints: { type: number, nullable: true, description: 剩余容量（当前迭代剩余可用工作日 × 容量系数；无进行中迭代为 null） }
        free: { type: boolean, description: 无在做事项且未请假/出差时为 true（「谁有空」） }
    Overview:
      type: object
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/OverviewMember' }
        canViewRisks: { type: boolean }
        risks:
          type: array
          items: { $ref: '#/components/schemas/RiskSignal' }
        iterationHealth:
          type: object
          nullable: true
          properties:
            iteration: { $ref: '#/components/schemas/Iteration' }
            completionRate: { type: integer, description: 完成率（已完成件数 / 非取消总件数，%） }
            remainingEstimate: { type: number }
            idealRemainingEstimate: { type: number }
            behind: { type: boolean, description: 实际剩余高于理想线 20% 以上 }
            blockedCount: { type: integer }
            staleCount: { type: integer }
    Report:
      type: object
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        kind: { type: string, enum: [STANDUP_SUMMARY, WEEKLY, ITERATION_SUMMARY, PERSONAL_WEEKLY, RISK_SUMMARY] }
        title: { type: string }
        periodStart: { type: string, format: date, nullable: true }
        periodEnd: { type: string, format: date, nullable: true }
        ownerId: { type: integer, format: int64, nullable: true, description: 个人周报的归属人 }
        content: { type: string, description: Markdown 正文 }
        aiGenerated: { type: boolean, description: 正文是否由 AI 叙述生成（M4：事实表由程序算，AI 只写叙述且校验一致才采用；AI 关闭/不可用/校验不过时为程序模板 false） }
        edited: { type: boolean }
        editedByHuman: { type: boolean, description: 修订二——是否被人工编辑过（重新生成后重置 false） }
        existed: { type: boolean, description: 仅 generate 响应——true 表示该周期已有报告、未新建 }
        version: { type: integer }
        iterationId: { type: integer, format: int64, nullable: true, description: 迭代总结所属迭代 }
        lastGeneratedAt: { type: string, format: date-time, nullable: true }
        deletedAt: { type: string, format: date-time, nullable: true, description: 软删除时间（回收站/墓碑） }
        deletedById: { type: integer, format: int64, nullable: true, description: 删除人（Q9 统一回收站展示） }
        restored: { type: boolean, description: 仅 generate 响应——Q1 墓碑被手动生成恢复时为 true }
        allowedActions:
          type: array
          description: Q11——当前请求用户可执行的操作键（VIEW/EDIT/DELETE/RESTORE/REGENERATE/EXPORT）
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TrashEntry:
      type: object
      description: Q9 统一回收站条目（事项与报告合并）
      properties:
        kind: { type: string, enum: [ITEM, REPORT] }
        id: { type: integer, format: int64 }
        code: { type: string, nullable: true, description: 事项显示编号；报告为 null }
        itemType: { type: string, nullable: true, description: 仅 ITEM }
        reportKind: { type: string, nullable: true, description: 仅 REPORT }
        title: { type: string }
        deletedAt: { type: string, format: date-time }
        deletedById: { type: integer, format: int64, nullable: true }
        deletedByName: { type: string, nullable: true }
    AiStatus:
      type: object
      properties:
        platformEnabled: { type: boolean, description: 平台总开关（服务端配置） }
        mode: { type: string, enum: [mock, live] }
        available: { type: boolean, description: 平台可用（总开关开且 mock 或 live 配置完整） }
        visionAvailable: { type: boolean, description: 识图是否可用（未配识图模型为 false，前端隐藏截图导入） }
        textModel: { type: string, nullable: true }
        visionModel: { type: string, nullable: true }
        features:
          type: object
          description: 各功能合并可用状态（平台开关 + 小组逐项开关 + 配置完整性），键为 paste-import/quick-update/split-stories/summarize/risk-summary/qa
          additionalProperties: { type: boolean }
        teamSettings: { $ref: '#/components/schemas/TeamAiSettings' }
    TeamAiSettings:
      type: object
      description: 小组 AI 逐项开关（缺省全开）
      properties:
        pasteImport: { type: boolean }
        quickUpdate: { type: boolean }
        splitStories: { type: boolean }
        summarize: { type: boolean }
        riskSummary: { type: boolean }
        qa: { type: boolean }
    AiCallLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        feature: { type: string }
        model: { type: string, nullable: true }
        durationMs: { type: integer, format: int64 }
        promptTokens: { type: integer, nullable: true }
        completionTokens: { type: integer, nullable: true }
        success: { type: boolean }
        error: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    PasteImportRow:
      type: object
      description: 粘贴导入预览行（程序匹配后的结果）
      properties:
        externalId: { type: string, nullable: true }
        title: { type: string }
        type: { type: string, enum: [TASK], description: 导入的是任务（修订一 ） }
        description: { type: string, nullable: true }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        ownerName: { type: string, nullable: true }
        ownerId: { type: integer, format: int64, nullable: true, description: 姓名匹配到的组内成员，对不上为 null }
        estimate: { type: number, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
        parentExternalId: { type: string, nullable: true }
        sourceSnippet: { type: string, description: 对应原文片段 }
        confidence: { type: number, description: 把握程度 0–1，低把握字段前端标黄 }
        matchStatus: { type: string, enum: [NEW, UPDATE, UNCHANGED] }
        existingItemId: { type: integer, format: int64, nullable: true }
        diff:
          type: object
          description: UPDATE 时的字段差异 {字段名：{from,to}}
          additionalProperties: { type: object }
    QuickAction:
      type: object
      description: 一句话更新动作卡（解析返回与确认执行共用）
      properties:
        kind: { type: string, enum: [UPDATE_ITEM, CREATE_ITEM] }
        itemId: { type: integer, format: int64, nullable: true, description: UPDATE_ITEM 的目标事项 }
        itemCode: { type: string, nullable: true }
        text: { type: string, nullable: true, description: 进展文字 }
        percent: { type: integer, nullable: true }
        submitReview: { type: boolean }
        blocked: { type: boolean }
        blockReason: { type: string, nullable: true }
        needsBlockConfirm: { type: boolean, description: 有阻塞类说法但未明说阻塞，确认时需询问 }
        candidateItemIds:
          type: array
          description: 拿不准时的候选事项（≤3）
          items: { type: integer, format: int64 }
        type: { type: string, nullable: true, description: CREATE_ITEM 的事项类型（STORY/DEFECT/ANALYSIS/ADHOC） }
        title: { type: string, nullable: true }
        ownerName: { type: string, nullable: true }
        ownerId: { type: integer, format: int64, nullable: true }
        dueDate: { type: string, format: date, nullable: true }
    SplitStoriesResult:
      type: object
      properties:
        taskId: { type: integer, format: int64 }
        stories:
          type: array
          items:
            type: object
            properties:
              storyCategory: { type: string, enum: [DEV, ANALYSIS, TEST, OTHER] }
              title: { type: string }
              description: { type: string }
              estimate: { type: number, nullable: true, description: AI 估算，仅供参考 }
        clarifyingQuestions:
          type: array
          items: { type: string }
        acceptancePoints:
          type: array
          items: { type: string }
    QaRecord:
      type: object
      properties:
        id: { type: integer, format: int64 }
        question: { type: string }
        answer: { type: string }
        found: { type: boolean }
        refs:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    ImportRowInput:
      type: object
      properties:
        externalId: { type: string, nullable: true }
        title: { type: string }
        description: { type: string, nullable: true }
        priority: { type: string, enum: [P0, P1, P2, P3] }
        estimate: { type: number, nullable: true, description: 估算 }
        dueDate: { type: string, format: date, nullable: true }
        externalUrl: { type: string, nullable: true }
    ImportBatch:
      type: object
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        creatorId: { type: integer, format: int64 }
        source: { type: string, enum: [AI_PASTE, FILE_MAPPING, ADAPTER] }
        total: { type: integer }
        createdCount: { type: integer }
        updatedCount: { type: integer }
        createdItemIds:
          type: array
          items: { type: integer, format: int64 }
        updatedItemIds:
          type: array
          items: { type: integer, format: int64 }
        skipped: { type: integer }
        undoneAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        link: { type: string, description: 批次链接（已生成内容的链接语义） }
    IntegrationAdapter:
      type: object
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        name: { type: string }
        type: { type: string, enum: [MOCK, HTTP] }
        systemName: { type: string, description: 外部系统名（同步识别键之一） }
        config:
          type: object
          description: HTTP 配置（url/method/listPath/fields/priorityMap/typeMap/userMap/authType/authToken/authUser/authPassword 等）；密钥回显脱敏为 ***
        enabled: { type: boolean }
        consecutiveFailures: { type: integer }
        createdBy: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    IntegrationAdapterInput:
      type: object
      properties:
        name: { type: string }
        type: { type: string, enum: [MOCK, HTTP] }
        systemName: { type: string }
        config: { type: object, description: 密钥只写不回显；PATCH 时传 *** 表示保留原值 }
        enabled: { type: boolean }
    SyncLog:
      type: object
      properties:
        id: { type: integer, format: int64 }
        adapterId: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        createdCount: { type: integer }
        updatedCount: { type: integer }
        failedCount: { type: integer }
        message: { type: string, nullable: true }
        success: { type: boolean }
        createdAt: { type: string, format: date-time }
