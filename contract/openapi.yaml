            schema:
              type: object
              properties:
                name: { type: string }
                goal: { type: string, nullable: true }
                startDate: { type: string, format: date }
                endDate: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      summary: 删除迭代（Q3 仅组长；仅规划中且未放入事项时可删，否则 409 DELETE_BLOCKED）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: iterationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/iterations/{iterationId}/start:
    post:
      summary: 开始迭代（Q3 起仅组长；PLANNING→ACTIVE；同组同时只能有一个 ACTIVE，已有进行中迭代时 409；开始时生成首张燃尽快照并通知全组）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: iterationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Iteration' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/iterations/{iterationId}/close:
    post:
      summary: 结束迭代并结转（Q3 起仅组长；ACTIVE/PLANNING→FINISHED；生成迭代总结报告）
      description: >
        未完成事项必须逐条给出去向：NEXT 结转到指定迭代（须为同组 PLANNING/ACTIVE 迭代）
        或 BACKLOG 退回待办池（清 iterationId）；漏给的未完成事项返回 400 并在 detail 里列出编号。
        improvements 为回顾会改进项标题，逐条自动建成带「改进项」标签的临时事项（不属于任何迭代）。
        结束时生成最后一张燃尽快照与迭代总结报告（kind=ITERATION_SUMMARY），并通知全组。
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: iterationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                decisions:
                  type: array
                  items:
                    type: object
                    required: [itemId, target]
                    properties:
                      itemId: { type: integer, format: int64 }
                      target: { type: string, enum: [NEXT, BACKLOG] }
                      nextIterationId: { type: integer, format: int64, description: target=NEXT 时必填 }
                improvements:
                  type: array
                  items: { type: string }
      responses:
        '200':
          description: OK，返回结束后的迭代与生成的总结报告 id
          content:
            application/json:
              schema:
                type: object
                properties:
                  iteration: { $ref: '#/components/schemas/Iteration' }
                  summaryReportId: { type: integer, format: int64 }
                  carriedItemIds:
                    type: array
                    items: { type: integer, format: int64 }
                  backlogItemIds:
                    type: array
                    items: { type: integer, format: int64 }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/iterations/{iterationId}/burndown:
    get:
      summary: 燃尽图数据（每晚快照 + 理想线；含当天实时点）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: iterationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Burndown' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/iterations/{iterationId}/snapshot:
    post:
      summary: 立即生成一张燃尽快照（组长或 PO；与每晚 23:30 定时快照同一口径，供演示与验收）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - name: iterationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Burndown' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/iterations/{iterationId}/key-dates:
    get:
      summary: 迭代关键日期列表（封版/投产/评审/其他）
      parameters:
