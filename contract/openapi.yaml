  /teams/{teamId}/items/{itemId}/nudge:
    post:
      summary: 单事项催一下（M3 补契约缺口 b，核心功能；Q13 支持 Idempotency-Key，同键 10 分钟只生效一次）
      description: >
        组内任何人可催「不是自己负责」的事项：待开始/进行中催全部负责人，待验收催验收人。
        同一发起人对同一事项每天只能催一次，第二次返回 409 NUDGE_DAILY_LIMIT。
        被催人请假/出差（当日状态生效）时不提醒本人，改记给组长（redirected=true），与验收 一致。
        至少一位真实对象被催到时事项 nudgeCount +1；被催人收到 NUDGE 通知，可用快捷回应回传。
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/ItemId' }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NudgeResult' }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /teams/{teamId}/items/{itemId}/nudge/respond:
    post:
      summary: 快捷回应催一下（被催人本人操作；回应回传给发起人；Q13 支持 Idempotency-Key，重复回应返回已回应状态 alreadyResponded=true 不报错）
      parameters:
        - { $ref: '#/components/parameters/TeamId' }
        - { $ref: '#/components/parameters/ItemId' }
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [response]
              properties:
                nudgeId: { type: integer, format: int64, description: 可选；缺省回应「发给我且尚未回应」的最近一条 }
                response: { type: string, enum: [SOON, TODAY, BLOCKED], description: SOON 马上更新 / TODAY 今天搞定 / BLOCKED 卡住了 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  nudgeId: { type: integer, format: int64 }
                  response: { type: string }
                  respondedAt: { type: string, format: date-time }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
