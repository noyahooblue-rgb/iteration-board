name: Windows Install Verification

# Real end-to-end run of the offline package on a Windows runner:
# build the full package on Linux, then install it on
# windows-latest (admin) and drive install / Playwright browser
# flow / stop-start / backup-skip / backup / restore / upgrade /
# uninstall / reinstall / space-path / --autostart phases via
# tools/ci/windows-verify.ps1. Console logs and the three
# Playwright screenshots are uploaded as the
# "windows-verify-evidence" artifact on every run.

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: '重跑档位：all=冒烟+全量 E2E；smoke=只跑档 2 冒烟；e2e=跳过冒烟单独跑档 3（P14b 等与冒烟解耦，wb89pp2z）'
        type: choice
        options: [all, smoke, e2e]
        default: all

jobs:
  build-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 提取 VC++ 运行库 DLL（微软官方 vc_redist 解包，哈希由构建脚本钉死校验）
        run: |
          mkdir -p "$HOME/7z"
          curl -sfL -o /tmp/7z.tar.xz "https://github.com/ip7z/7zip/releases/download/24.09/7z2409-linux-x64.tar.xz"
          tar -xf /tmp/7z.tar.xz -C "$HOME/7z"
          export PATH="$HOME/7z:$PATH"
          bash tools/ci/extract-vc-dlls.sh
      - name: 构建离线全量包（IB_CI 模式：系统 Maven 在线构建）
        env:
          IB_CI: '1'
        run: bash packaging/build-package.sh
      # 1.1.0 起同源组装三个补丁包，让常驻档 3 的恶劣路径矩阵 N1
      # （rc4 -> 1.1.0 补丁）能用真实包实跑，不再 SKIP。
      - name: 组装补丁包（与全量包同源同 jar）
        run: bash packaging/build-patches.sh
      # 矩阵夹具：真实 rc4（N1）/ 1.0.4 / 1.0.1（N3）全量包太大进不了 git，放在 Drive
      # 「安装包/CI夹具」文件夹（链接可读）。下载失败时矩阵对应项会
      # 显式 SKIP 并在日志留痕，不会静默假绿。
      - name: 下载 N3 夹具包（Drive 链接直下）
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $fixtures = @(
            @{ Id = '1mg6_0CacZtR2KPsWceJQUOerWNpwMw3j'; Name = 'iteration-board-offline-1.1.0-rc4.zip' },
            @{ Id = '1_4m8wi41Bv1u-T4z68eyDPSMCIAGvyIl'; Name = 'iteration-board-offline-1.0.4.zip' },
            @{ Id = '15mt0HyshDUrAqUPGw0UfRlYCmEWg8HdG'; Name = 'iteration-board-offline-1.0.1.zip' }
          )
          foreach ($f in $fixtures) {
            $url = "https://drive.usercontent.google.com/download?id=$($f.Id)&export=download&confirm=t"
            $out = Join-Path 'packaging/dist' $f.Name
            try {
              Invoke-WebRequest -Uri $url -OutFile $out -MaximumRedirection 5
              Write-Host "fixture downloaded: $($f.Name) $((Get-Item $out).Length) bytes"
            } catch {
              Write-Warning "fixture download failed: $($f.Name): $($_.Exception.Message)"
            }
          }
      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: ib-offline-package
          path: |
            packaging/dist/iteration-board-offline-1.1.0.zip
            packaging/dist/iteration-board-offline-1.1.0-rc4.zip
            packaging/dist/iteration-board-patch-1.1.0-rc4-to-1.1.0.zip
            packaging/dist/iteration-board-patch-1.0.4-to-1.1.0.zip
            packaging/dist/iteration-board-patch-1.0.1-to-1.1.0.zip
            packaging/dist/iteration-board-offline-1.0.4.zip
            packaging/dist/iteration-board-offline-1.0.1.zip
          if-no-files-found: warn
          retention-days: 7

  # 档 2（Windows 冒烟，目标 ≤20 分钟）：中文+空格路径、中文 TEMP、chcp 936 下
  # install → 健康 → 密码文件登录 admin → 改密 → stop → start → uninstall。
  windows-smoke:
    needs: build-package
    if: ${{ inputs.tier != 'e2e' }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 迁移设置应用回归测试（台账第 8 条：从 migrate-import.bat 提取出货命令原文实测，防 $1 替换泄漏）
        shell: powershell
        timeout-minutes: 5
        run: ./tools/ci/test-migrate-settings.ps1
      - name: 安装 Playwright（S5 门禁脚本 + 自带 Chromium 129 对照组）
        shell: pwsh
        timeout-minutes: 10
        working-directory: tools/windows-e2e
        run: |
          npm install --no-fund --no-audit
          npx playwright install chromium
      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: ib-offline-package
          path: C:\ibdl
      - name: 下载 Chrome for Testing 128（单位浏览器兼容门禁）
        shell: pwsh
        timeout-minutes: 5
        run: |
          Invoke-WebRequest -Uri 'https://storage.googleapis.com/chrome-for-testing-public/128.0.6613.120/win64/chrome-win64.zip' -OutFile 'C:\ibdl\cft128.zip'
          Expand-Archive -Path 'C:\ibdl\cft128.zip' -DestinationPath 'C:\ibdl\cft128' -Force
      - name: Windows 冒烟（档 2）
        shell: pwsh
        timeout-minutes: 20
        run: ./tools/ci/windows-smoke.ps1 -ChromeExe 'C:\ibdl\cft128\chrome-win64\chrome.exe'
      - name: 上传冒烟证据（脚本输出/应用与 PG 日志/WinSW 日志/SCM 事件）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-smoke-evidence
          path: C:\ibwork-smoke\evidence
          retention-days: 7
          if-no-files-found: warn

  # 档 3（全量 E2E 剧本）：默认只在档 2 冒烟全绿后跑；workflow_dispatch
  # 选 tier=e2e 时与冒烟解耦单独跑（wb89pp2z：P14b 回滚演练等先行验证）。
  windows-install:
    needs: [build-package, windows-smoke]
    if: ${{ always() && inputs.tier != 'smoke' && needs.build-package.result == 'success' && (needs.windows-smoke.result == 'success' || needs.windows-smoke.result == 'skipped') }}
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          name: ib-offline-package
          path: C:\ibdl
      - name: Windows 实跑全流程
        shell: pwsh
        run: ./tools/ci/windows-verify.ps1
      # 恶劣路径矩阵（1.1.0 脚本专项，rucc9a9y/7pjby64d）：补丁目录三类恶劣
      # 路径 × 带参/双击两方式（N1）+ 恶劣安装目录运维脚本（N2）+ 老版本
      # 夹具补丁升级（N3）。补丁包与夹具包是打包阶段产物：zip 出现在
      # C:\ibdl 时自动带参启用对应段，缺席时脚本内显式 SKIP 并打 warning，
      # N2 只依赖全量包、恒跑。打包阶段交付时把补丁/夹具 zip 作为产物
      # 下载到 C:\ibdl 即可全量激活，无需再改本 workflow。
      - name: 恶劣路径矩阵（windows-nasty-paths）
        shell: pwsh
        timeout-minutes: 45
        run: |
          $nargs = @{ FullZip = 'C:\ibdl\iteration-board-offline-1.1.0.zip' }
          $patch = 'C:\ibdl\iteration-board-patch-1.1.0-rc4-to-1.1.0.zip'
          if (Test-Path $patch) { $nargs['PatchZip'] = $patch }
          $rc4 = 'C:\ibdl\iteration-board-offline-1.1.0-rc4.zip'
          if (Test-Path $rc4) { $nargs['Rc4Zip'] = $rc4 }
          $z104 = 'C:\ibdl\iteration-board-offline-1.0.4.zip'
          $p104 = 'C:\ibdl\iteration-board-patch-1.0.4-to-1.1.0.zip'
          if ((Test-Path $z104) -and (Test-Path $p104)) { $nargs['OldZip104'] = $z104; $nargs['Patch104'] = $p104 }
          $z101 = 'C:\ibdl\iteration-board-offline-1.0.1.zip'
          $p101 = 'C:\ibdl\iteration-board-patch-1.0.1-to-1.1.0.zip'
          if ((Test-Path $z101) -and (Test-Path $p101)) { $nargs['OldZip101'] = $z101; $nargs['Patch101'] = $p101 }
          & ./tools/ci/windows-nasty-paths.ps1 @nargs
      - name: 上传恶劣路径矩阵证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-nasty-evidence
          path: C:\ibnasty\evidence
          retention-days: 7
          if-no-files-found: warn
      - name: 上传日志与截图证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-verify-evidence
          path: C:\ibwork\evidence
          retention-days: 7
          if-no-files-found: warn
