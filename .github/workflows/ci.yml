name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iteration_board
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iteration_board"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/iteration_board
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: 后端测试
        working-directory: backend
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        working-directory: frontend
        run: npm ci
      - name: 真实（非 mock）构建
        working-directory: frontend
        run: npm run build
      - name: 隔离检查（真实构建产物不得含演示数据与演示口令）
        working-directory: frontend
        run: |
          if grep -r -q '云雀小组' dist; then echo '::error::真实构建产物中出现演示数据字符串「云雀小组」'; exit 1; fi
          if grep -r -q 'Demo1234' dist; then echo '::error::真实构建产物中出现演示口令'; exit 1; fi
          if grep -r -q 'CHANGE_ME_DEMO_PASSWORD' dist; then echo '::error::真实构建产物中出现演示口令占位符'; exit 1; fi
          echo '隔离检查通过'
