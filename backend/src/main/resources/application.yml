server:
  port: 8080
  servlet:
    session:
      timeout: 8h
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: iteration-board
  # 数据库口令等敏感值一律由环境变量注入，无默认值：启动前必须设置 DB_PASSWORD（见根 README「本地运行」）。
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/iteration_board}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # 存储口径保持 UTC 不变（1.0.4 时区统一）：时间戳一律以 UTC Instant 落库、接口以 ISO 8601（带 Z）返回，
          # 显示时区由前端按浏览器本地时区转换；「今天/本周」等日期口径走 app.timezone（见 PlatformTime），与此无关，不要改成平台时区。
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

# 接口文档（Swagger UI / OpenAPI）：生产默认关闭（1.1.0-rc2 安全裁定 hsa43amn）。
# 需要时把 IB_API_DOCS_ENABLED / IB_SWAGGER_UI_ENABLED 改为 true 后重启应用；
# 开启后也仅限已登录的平台管理员访问（见 SecurityConfig）。
springdoc:
  api-docs:
    enabled: ${IB_API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${IB_SWAGGER_UI_ENABLED:false}

app:
  # 程序版本（1.1.0-rc2）：与 pom 版本一致；构建日期由 spring-boot build-info 注入（见 VersionInfo）。
  version: 1.1.0-rc4
  # 数据目录（贴图等运行期文件与 backup-status.json 所在目录；脚本侧约定，见 BackupStatusService）
  data-dir: ${APP_DATA_DIR:data}
  # 管理员启动初始化（1.1.0 裁定第一步）：AdminBootstrapRunner 建 admin 后把初始密码写到此文件
  # （相对路径按进程工作目录解析，安装布局下即安装根目录的 config\admin-initial-password.txt）；
  # admin 首次改密成功后应用自动删除该文件。reset-admin 运维命令也把新密码写到此文件。
  bootstrap-password-file: ${APP_BOOTSTRAP_PASSWORD_FILE:config/admin-initial-password.txt}
  # 启动时是否自动建 admin（默认开；仅自动化测试等场景关闭，生产不要关）。
  bootstrap-admin-enabled: ${APP_BOOTSTRAP_ADMIN_ENABLED:true}
  # 平台时区（1.0.4）：所有「今天/昨天/本周/工作日/逾期/定时任务」等日期口径按此时区计算（PlatformTime 组件），
  # 可经环境变量 APP_TIMEZONE 覆盖；与 Asia/Singapore 同为 UTC+8。数据库存储仍为 UTC（见上方 hibernate.jdbc.time_zone 注释）。
  timezone: ${APP_TIMEZONE:Asia/Shanghai}
  registration-open: ${REGISTRATION_OPEN:true}
  demo-mode: ${DEMO_MODE:false}
  # 数据留存：回收站物理清理 / 通知 / 审计日志保留期，均可经环境变量覆盖。
  retention:
    trash-days: ${RETENTION_TRASH_DAYS:30}
    notification-days: ${RETENTION_NOTIFICATION_DAYS:90}
    audit-days: ${RETENTION_AUDIT_DAYS:180}
    purge-cron: ${RETENTION_PURGE_CRON:0 17 3 * * *}

# AI 服务层：密钥只由环境变量注入；mode=mock 时返回结构化样例结果。
ai:
  base-url: ${AI_BASE_URL:}
  api-key: ${AI_API_KEY:}
  text-model: ${AI_TEXT_MODEL:}
  vision-model: ${AI_VISION_MODEL:}
  mode: ${AI_MODE:mock}
  timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
  platform-enabled: ${AI_PLATFORM_ENABLED:true}
  prompts-dir: ${AI_PROMPTS_DIR:config/prompts}

logging:
  level:
    com.iterationboard: INFO
