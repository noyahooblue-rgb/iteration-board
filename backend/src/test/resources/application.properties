# 测试连接 PostgreSQL（iteration_board 库）：走 TCP，连接参数由环境变量提供，
# 默认值与 GitHub Actions 的 PostgreSQL 服务容器对齐（见 .github/workflows/ci.yml）。
# 本地运行时可通过 TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD 覆盖。
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/iteration_board}
spring.datasource.username=${TEST_DB_USERNAME:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}
# 共享测试上下文关闭启动建号（既有集成测试以「库中无 admin」为前提）；
# 启动初始化本身由专门的测试以独立上下文（覆盖此开关为 true）覆盖。
app.bootstrap-admin-enabled=false
